name: hrm.hrm_act_v1@HierarchicalReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

# Retain the existing adaptive-halting setup.  An exact evaluation-bin match is
# the binary reward used by the unchanged ACT loss head.
halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 2
L_cycles: 2

H_layers: 4
L_layers: 4

hidden_size: 512
num_heads: 8
expansion: 4

# The current training code always constructs a sparse puzzle-embedding
# optimizer.  Keep a single unused identifier to avoid changing that code.
puzzle_emb_ndim: ${.hidden_size}
pos_encodings: learned
