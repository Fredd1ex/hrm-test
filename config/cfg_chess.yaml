defaults:
  - arch: hrm_chess
  - _self_

hydra:
  output_subdir: null

data_path: data/chess-eval

global_batch_size: 768
epochs: 10
eval_interval: 1
checkpoint_every_eval: True
checkpoint_every_steps: 250

lr: 1e-4
lr_min_ratio: 0.1
lr_warmup_steps: 2000

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1
puzzle_emb_lr: 1e-2
